services:
  cf-tunnel-manager:
    image: cf-tunnel-manager:latest
    build:
      context: .
      # 基础镜像默认走国内加速站（docker.1ms.run），可在项目目录的 .env 里覆盖，
      # 例如切回官方源：NODE_IMAGE=node:22-alpine
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:22-alpine}
        CLOUDFLARED_IMAGE: ${CLOUDFLARED_IMAGE:-docker.1ms.run/cloudflare/cloudflared:latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: cf-tunnel-manager
    restart: unless-stopped
    network_mode: host          # 让 cloudflared 直接访问宿主机内网服务（NAS 最简方式）
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 管理面板登录密码（留空则不启用登录认证，仅建议内网使用）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/data
      # 源码挂载：开启后可在面板「关于」页一键检测并更新（更新不影响 data/）
      # 面板内更新 = git fetch + reset --hard 到最新提交，随后容器自动重启加载新代码
      - ./:/app
    # 如果不使用 host 网络，请改用 ports 映射，并把下面服务的地址改为宿主机 IP：
    # ports:
    #   - "19090:19090"   # Web 管理面板
    #   - "19092:19092"   # 外部 RESTful API
    #   - "19093:19093"   # MCP 服务

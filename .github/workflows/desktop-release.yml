name: Build desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
          - os: ubuntu-22.04
            suffix: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install
      - name: Smoke test local service
        shell: bash
        run: |
          rm -rf .ci-data
          DATA_DIR="$PWD/.ci-data" WEB_PORT=19090 API_PORT=19092 MCP_PORT=19093 node src/server.js > .ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19090/api/auth/state > .ci-state.json; then break; fi
            sleep 1
          done
          node -e "const s=require('./.ci-state.json'); if(!s.success || !s.data.needsSetup) { console.error(s); process.exit(1) }; console.log('auth state smoke test ok')"
      - name: Download bundled Node runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/runtime | Out-Null
          Invoke-WebRequest https://nodejs.org/dist/v20.19.5/node-v20.19.5-win-x64.zip -OutFile node.zip
          Expand-Archive node.zip node-extracted
          Copy-Item node-extracted/node-v20.19.5-win-x64/node.exe desktop/src-tauri/runtime/node.exe
      - name: Download bundled Node runtime (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop/src-tauri/runtime
          curl -fsSL https://nodejs.org/dist/v20.19.5/node-v20.19.5-${{ runner.os == 'macOS' && 'darwin-x64' || 'linux-x64' }}.tar.gz | tar xz --strip-components=2 -C desktop/src-tauri/runtime '*/bin/node'
      - name: Build Tauri bundle
        run: npx tauri build --config desktop/src-tauri/tauri.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfm-${{ matrix.suffix }}
          path: desktop/src-tauri/target/release/bundle/**

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cfm-*
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.appimage' -o -iname '*.deb' \) -print0 \
            | xargs -0 -r -n1 gh release upload "${{ github.ref_name }}" --clobber --repo "${{ github.repository }}"

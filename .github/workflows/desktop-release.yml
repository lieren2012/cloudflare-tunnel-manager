name: Build desktop releases
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'public/**', 'scripts/*desktop*', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: node scripts/prepare-desktop.mjs
      - run: node scripts/download-desktop-runtime.mjs
      - run: node scripts/test-desktop-runtime.mjs
      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx tauri build --config desktop/src-tauri/tauri.conf.json --bundles deb
          else
            npx tauri build --config desktop/src-tauri/tauri.conf.json
          fi
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $extract = Join-Path $env:RUNNER_TEMP 'cfm-installed'
          $process = Start-Process msiexec.exe -ArgumentList @('/a', ('"' + $msi + '"'), '/qn', ('TARGETDIR="' + $extract + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'MSI extraction failed' }
          $exe = (Get-ChildItem $extract -Recurse -Filter cf-tunnel-manager-desktop.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Packaged executable missing' }
          node scripts/test-installed-desktop.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged desktop functional test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
